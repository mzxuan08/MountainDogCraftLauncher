name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python -m unittest discover -s packaging/tests -v
      - shell: pwsh
        run: ./packaging/publish.ps1 -RuntimeIdentifiers '${{ matrix.rid }}'
      - shell: pwsh
        run: ./packaging/package.ps1 -SkipPublish -RuntimeIdentifiers '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: MDCL-${{ matrix.rid }}-UNVERIFIED
          path: |
            artifacts/packages/
            artifacts/verification/release/
